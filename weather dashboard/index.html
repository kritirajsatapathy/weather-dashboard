<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard (India)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🇮🇳 Weather Dashboard (India)</h1>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter Indian city name..." />
      <button id="searchBtn">Search</button>
    </div>

    <div id="weatherInfo" class="weather-info hidden">
      <h2 id="cityName"></h2>
      <p id="date"></p>
      <div class="weather-main">
        <img id="weatherIcon" alt="Weather Icon" />
        <p id="temp"></p>
      </div>
      <p id="description"></p>
      <p><strong>Humidity:</strong> <span id="humidity"></span>%</p>
      <p><strong>Wind Speed:</strong> <span id="wind"></span> m/s</p>
    </div>

    <h3 id="forecastTitle" class="hidden">5-Day Forecast</h3>
    <div id="forecastContainer" class="forecast-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
