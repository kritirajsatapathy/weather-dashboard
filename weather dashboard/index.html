<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Heading -->
        <h1>🇮🇳 Weather Dashboard (India)</h1>

        <!-- Search Section -->
        <div class="search-box">

            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter Indian city name..."
            >

            <button id="searchBtn">
                Search
            </button>

        </div>


        <!-- Current Weather -->
        <div id="weatherContainer" class="hidden">

            <div class="weather-card">

                <h2 id="city"></h2>
                    
                

                <p id="date"></p>
                   
                

                <div class="main-weather">

                    <div class="weather-icon"></div>
                        
                    

                    <div>
                        <div id="temperature" class="temperature"> </div>
                           
                       

                        <div id="description" class="description"></div>
                           
                      
                    </div>

                </div>

                <div class="weather-details">

                    <p>
                        <strong>Humidity:</strong>
                        <span id="humidity">%</span>
                    </p>

                    <p>
                        <strong>Wind Speed:</strong>
                        <span id="windSpeed">m/s</span>
                    </p>

                </div>

            </div>


            <!-- Forecast -->
            <h2 class="forecast-title">
                5-Day Forecast
            </h2>

            <div id="forecast" class="forecast-container">

                <!-- Forecast cards will be added using JavaScript -->

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
